name: Performance Tests

# ══════════════════════════════════════════════════════════════════════════════
# Workflow de Testes de Performance — voting-session-k6
#
# Triggers:
#   - Disparo manual (workflow_dispatch) com escolha de tipo e ambiente
#   - Schedule: carga diária às 02:00 UTC (smoke de saúde da API)
#
# Ambientes suportados:
#   - staging (padrão)
#   - prod    (somente load — nunca stress/spike em prod automaticamente)
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de teste'
        required: true
        type: choice
        options:
          - load
          - stress
          - spike
          - soak
          - volume
          - quick-tests
        default: load
      base_url:
        description: 'URL base da API (deixe vazio para usar a do ambiente)'
        required: false
        default: ''
      load_vus:
        description: 'Número de VUs (carga)'
        required: false
        default: '30'
      soak_duration:
        description: 'Duração do soak test'
        required: false
        default: '10m'
      volume_agendas:
        description: 'Total de pautas (volume test)'
        required: false
        default: '200'

  schedule:
    # Smoke de carga diário às 02:00 UTC — verifica saúde da API
    - cron: '0 2 * * *'

env:
  LOAD_VUS:             ${{ inputs.load_vus || '30' }}
  SOAK_DURATION:        ${{ inputs.soak_duration || '10m' }}
  VOLUME_AGENDAS:       ${{ inputs.volume_agendas || '200' }}
  VOLUME_VOTES_PER_AGENDA: '10'

jobs:
  # ─── Instalação e execução do teste ─────────────────────────────────────────
  k6-test:
    name: "k6 — ${{ inputs.test_type || 'load' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 jq -y
          k6 version

      - name: Determine API URL
        id: api-url
        run: |
          if [[ -n "${{ inputs.base_url }}" ]]; then
            echo "url=${{ inputs.base_url }}" >> $GITHUB_OUTPUT
          else
            # URL de staging configurada como secret no repositório
            echo "url=${{ secrets.STAGING_API_URL || 'http://localhost:8080' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Performance Test
        id: test
        run: |
          chmod +x run/run-test.sh run/run-all.sh run/generate-report.sh
          TEST_TYPE="${{ inputs.test_type || 'load' }}"

          if [[ "$TEST_TYPE" == "quick-tests" ]]; then
            ./run/run-all.sh --skip soak
          else
            ./run/run-test.sh "$TEST_TYPE"
          fi
        env:
          BASE_URL: ${{ steps.api-url.outputs.url }}
        continue-on-error: true  # Não falha o job; thresholds são analisados abaixo

      - name: Set Test Status
        id: status
        run: |
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then
            echo "result=✅ PASSOU" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          else
            echo "result=❌ FALHOU" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          fi

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports-${{ inputs.test_type || 'load' }}-${{ github.run_number }}
          path: reports/
          retention-days: 30

      # ─── Notificação Discord ───────────────────────────────────────────────
      - name: Notify Discord
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TEST_TYPE="${{ inputs.test_type || 'load' }}"
          STATUS="${{ steps.status.outputs.result }}"
          COLOR="${{ steps.status.outputs.color }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🔥 k6 — Teste de Performance: ${TEST_TYPE}\",
                \"description\": \"**Status:** ${STATUS}\n**Alvo:** ${{ steps.api-url.outputs.url }}\n**VUs:** ${LOAD_VUS}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Repositório\", \"value\": \"voting-session-k6\", \"inline\": true},
                  {\"name\": \"Trigger\", \"value\": \"${{ github.event_name }}\", \"inline\": true},
                  {\"name\": \"Run\", \"value\": \"[Ver detalhes](${RUN_URL})\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"Commit: ${{ github.sha }}\"}
              }]
            }"

      # ─── Notificação Email ─────────────────────────────────────────────────
      - name: Notify Email
        if: always() && env.SMTP_HOST != ''
        uses: dawidd6/action-send-mail@v3
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
          subject: "🔥 [k6] ${{ inputs.test_type || 'load' }} — ${{ steps.status.outputs.result }}"
          html_body: |
            <h2>🔥 k6 Performance Test — ${{ inputs.test_type || 'load' }}</h2>
            <p><strong>Status:</strong> ${{ steps.status.outputs.result }}</p>
            <p><strong>URL alvo:</strong> ${{ steps.api-url.outputs.url }}</p>
            <p><strong>VUs:</strong> ${{ env.LOAD_VUS }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              Ver execução no GitHub Actions
            </a></p>
            <p>Relatórios disponíveis como artefatos no link acima.</p>

      # Falha o job se o teste falhou (após notificações)
      - name: Fail if test failed
        if: steps.test.outcome == 'failure'
        run: exit 1
